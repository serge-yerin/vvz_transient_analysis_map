# Conda environment for the MMODA service container.
#
# MMODA reads this from the repository root. The notebook itself lives in
# mmoda/; see README.md (Part II) for the full integration notes.
name: utr2-transients
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # libmagic is required by the MMODA test tooling (nb2workflow / dispatcher).
  - libmagic
  - pip:
      - -r requirements.txt
